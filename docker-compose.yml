services:
  # Node
  node:
    build: .
    container_name: nodejs
    working_dir: /usr/src/app
    env_file:
      - .env

  # MySQL Database
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_USER_PASS}
    volumes:
      - mysql_data:/var/lib/mysql

  #Redis Database
  redis:
    image: redis:alpine
    container_name: redis
